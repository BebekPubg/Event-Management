<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
        }
        
        .form-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, #ff9f43 0%, #ff7e29 100%);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0984e3 0%, #0652DD 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(9, 132, 227, 0.2);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #ff9f43 0%, #ff7e29 100%);
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(255, 159, 67, 0.2);
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e4e8eb;
        }
        
        .input-field:focus {
            border-color: #0984e3;
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.2);
        }
        
        .tab-active {
            color: #0984e3;
            border-bottom: 3px solid #0984e3;
        }
        
        .demo-badge {
            background: linear-gradient(135deg, #ff9f43 0%, #ff7e29 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="form-container w-full max-w-md relative">
        <div class="demo-badge">DEMO ONLY</div>
        
        <div class="form-header p-6 text-white">
            <h1 class="text-2xl font-bold mb-1">Welcome</h1>
            <p class="opacity-90">Sign in to continue or create an account</p>
        </div>
        
        <div class="tabs flex border-b" role="tablist">
            <button id="login-tab" class="tab-active flex-1 py-4 font-medium text-center" role="tab" aria-selected="true" aria-controls="login-form">Login</button>
            <button id="register-tab" class="flex-1 py-4 font-medium text-center text-gray-500" role="tab" aria-selected="false" aria-controls="register-form">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="p-6" role="tabpanel" aria-labelledby="login-tab">
            <div class="mb-4">
                <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="login-email" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="your@email.com">
            </div>
            
            <div class="mb-6">
                <div class="flex justify-between mb-1">
                    <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                    <a href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
                </div>
                <input type="password" id="login-password" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="••••••••">
            </div>
            
            <button class="btn-primary w-full py-3 text-white font-medium rounded-lg">Sign In</button>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">Or continue with</p>
                <div class="flex justify-center gap-4 mt-3">
                    <button class="flex items-center justify-center w-12 h-12 rounded-full border border-gray-300 hover:border-gray-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#4285F4"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    </button>
                    <button class="flex items-center justify-center w-12 h-12 rounded-full border border-gray-300 hover:border-gray-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </button>
                    <button class="flex items-center justify-center w-12 h-12 rounded-full border border-gray-300 hover:border-gray-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Register Form (Hidden by default) -->
        <div id="register-form" class="p-6 hidden" role="tabpanel" aria-labelledby="register-tab" aria-hidden="true">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="first-name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" id="first-name" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="John">
                </div>
                <div>
                    <label for="last-name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="last-name" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="Doe">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="register-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="register-email" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="your@email.com">
            </div>
            
            <div class="mb-4">
                <label for="register-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="register-password" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="••••••••">
            </div>
            
            <div class="mb-6">
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm-password" class="input-field w-full px-4 py-3 rounded-lg outline-none" placeholder="••••••••">
            </div>
            
            <div class="mb-6">
                <label class="flex items-center">
                    <input type="checkbox" class="w-4 h-4 text-blue-600">
                    <span class="ml-2 text-sm text-gray-600">I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a></span>
                </label>
            </div>
            
            <button class="btn-secondary w-full py-3 text-white font-medium rounded-lg">Create Account</button>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const formButtons = document.querySelectorAll('button.btn-primary, button.btn-secondary');

        function activateTab(tab) {
            const isLoginTab = tab === 'login';

            loginTab.classList.toggle('tab-active', isLoginTab);
            loginTab.classList.toggle('text-gray-500', !isLoginTab);
            loginTab.setAttribute('aria-selected', String(isLoginTab));

            registerTab.classList.toggle('tab-active', !isLoginTab);
            registerTab.classList.toggle('text-gray-500', isLoginTab);
            registerTab.setAttribute('aria-selected', String(!isLoginTab));

            loginForm.classList.toggle('hidden', !isLoginTab);
            loginForm.setAttribute('aria-hidden', String(!isLoginTab));

            registerForm.classList.toggle('hidden', isLoginTab);
            registerForm.setAttribute('aria-hidden', String(isLoginTab));
        }

        loginTab.addEventListener('click', () => activateTab('login'));
        registerTab.addEventListener('click', () => activateTab('register'));

        formButtons.forEach((button) => {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                alert('This is a demo form. In a real application, this would securely process your information.');
            });
        });
    </script>
</body>
</html>
